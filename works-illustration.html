<!DOCTYPE html>

  <header>
    <nav class="nav page">
      <a class="brand" href="index.html#home">
        <span class="ghost-logo">•ㅅ•</span>
        <span>飄霖 Live2D Studio</span>
      </a>

      <div class="desktop-nav">
        <a href="index.html#home">首頁</a>

        <a href="index.html#services">委託項目</a>
        <a href="index.html#process">委託流程</a>
        <a href="index.html#contact">聯絡我</a>

  </header>

  <main>
    <section class="works-page">
      <div class="page">
        <div class="section-title">
          <h2>立繪作品展示</h2>
          <p>Illustration Works</p>
        </div>

        <div class="works-page-note">
          過去委託作品、角色立繪、三視圖與設計展示。

        <div class="gallery-grid">
          <article class="gallery-card">

          <article class="gallery-card">
            <img src="images/works/illust-04.png" alt="角色設計作品 04" />
            <div class="gallery-info">
              <h3>角色設計</h3>
              <p>服裝 / 髮型 / 配色設計</p>

        <div class="back-link-wrap">
          <a class="btn secondary" href="index.html#works">返回主頁</a>
